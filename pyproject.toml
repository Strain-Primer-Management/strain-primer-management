# Tool configuration only (this is not a Python package). LEAD-ONLY FILE:
# formatter settings must be identical for everyone, otherwise people reformat each
# other's code and create conflicts.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]  # generated by Django, never hand-formatted

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle + pyflakes
    "I",            # import sorting
    "B",            # likely bugs
    "DJ",           # Django-specific checks
]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]  # `from .base import *` is the Django convention
"docs/handbook/build_handbook.py" = ["E501"]  # long text lines: this script only builds a PDF

[tool.djlint]
profile = "django"
indent = 2
max_line_length = 110
ignore = "H006,H030,H031"  # img size hints, meta description/keywords: not relevant for an internal tool
