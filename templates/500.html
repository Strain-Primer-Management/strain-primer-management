<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Something went wrong · Strain DB</title>
    <!-- STANDALONE on purpose: no base template and no template tags, so it still shows when everything else is broken. -->
    <!-- djlint:off D004,D018 -->
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/pages/core-error.css">
  </head>
  <body>
    <main class="container">
      <section class="error-card">
        <p class="error-code">500</p>
        <h1>Something went wrong on our side</h1>
        <p class="error-text">The page could not be shown because of a problem in the app. Please try again in a moment. If it keeps happening, tell a lab admin.</p>
        <div class="error-actions">
          <a class="error-button error-button-primary" href="/">Back to home</a>
          <a class="error-button error-button-secondary" href="/accounts/login/">Log in</a>
        </div>
      </section>
    </main>
  </body>
</html>
